define command {
  command_name                   check_ncpa_stromreader_data
  command_line                   $USER1$/check_ncpa.py -H $HOSTADDRESS$ -P 5693 -t $USER5$ -M plugins/check_stromreader_data.py -a "-w 180 -c 600"
}

define service {
  service_description            Stromreader Datenalter
  host_name                      raspi-stromzaehler
  use                            generic-service
  check_command                  check_ncpa_stromreader_data
  check_interval                 2
  retry_interval                 1
  max_check_attempts             3
  notifications_enabled          1
  contacts                       pushover
}
